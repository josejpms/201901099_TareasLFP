<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helado 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #7ec8e3;
      --sky-mid: #b8e0d2;
      --sky-bottom: #f7d9a8;
      --ink: #1a2b33;
      --cream: #fff8ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background: linear-gradient(165deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    }

    canvas#scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .brand {
      position: absolute;
      inset: 0 auto auto 0;
      z-index: 2;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      pointer-events: none;
      animation: rise 1s ease-out both;
    }

    .brand h1 {
      font-family: "Fraunces", serif;
      font-optical-sizing: auto;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: var(--cream);
      text-shadow: 0 2px 24px rgba(26, 43, 51, 0.18);
    }

    .brand p {
      margin-top: 0.65rem;
      max-width: 18rem;
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      font-weight: 400;
      color: rgba(26, 43, 51, 0.78);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: clamp(1rem, 3vw, 1.75rem);
      z-index: 2;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: rgba(26, 43, 51, 0.55);
      pointer-events: none;
      animation: fade 1.2s ease 0.4s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <h1>Helado</h1>
    <p>Modelado procedural en Three.js — arrastra para girar.</p>
  </header>
  <p class="hint">Arrastra · scroll para zoom</p>
  <canvas id="scene"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(3.8, 1.85, 5.0);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.2;
    controls.maxDistance = 9;
    controls.target.set(0, 0.35, 0);
    controls.maxPolarAngle = Math.PI * 0.58;

    // Lights
    const hemi = new THREE.HemisphereLight(0xb8e4ff, 0xf0c48a, 1.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff2dd, 2.2);
    key.position.set(4, 8, 3);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 20;
    key.shadow.camera.left = -4;
    key.shadow.camera.right = 4;
    key.shadow.camera.top = 4;
    key.shadow.camera.bottom = -4;
    key.shadow.radius = 3;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9ad7ff, 0.55);
    fill.position.set(-5, 2, -2);
    scene.add(fill);

    const rim = new THREE.PointLight(0xffb4a2, 1.4, 12);
    rim.position.set(-1.5, 2.5, 2.5);
    scene.add(rim);

    // Soft ground disc (shadow catcher feel)
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(3.2, 64),
      new THREE.MeshStandardMaterial({
        color: 0xf2c98a,
        roughness: 0.92,
        metalness: 0,
        transparent: true,
        opacity: 0.55,
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.35;
    ground.receiveShadow = true;
    scene.add(ground);

    const helado = new THREE.Group();
    scene.add(helado);

    // --- Waffle cone ---
    function makeWaffleTexture() {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#d4a05a";
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = "#a86b2f";
      ctx.lineWidth = 6;
      const step = 28;
      for (let i = -size; i < size * 2; i += step) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i + size, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(i, size);
        ctx.lineTo(i + size, 0);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const waffleMap = makeWaffleTexture();
    const coneMat = new THREE.MeshStandardMaterial({
      map: waffleMap,
      roughness: 0.78,
      metalness: 0.02,
      flatShading: false,
    });

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.55, 1.7, 48, 1, true),
      coneMat
    );
    cone.position.y = -0.55;
    cone.rotation.y = Math.PI / 8;
    cone.castShadow = true;
    cone.receiveShadow = true;
    helado.add(cone);

    // Cone rim lip
    const rimRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.54, 0.045, 16, 64),
      new THREE.MeshStandardMaterial({
        color: 0xc8893f,
        roughness: 0.7,
        metalness: 0.05,
      })
    );
    rimRing.rotation.x = Math.PI / 2;
    rimRing.position.y = 0.28;
    rimRing.castShadow = true;
    helado.add(rimRing);

    // --- Soft scoops ---
    function scoop(color, y, x = 0, z = 0, scale = 1) {
      const geo = new THREE.SphereGeometry(0.48 * scale, 48, 48);
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.42,
        metalness: 0.05,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Soft “melt” blobs around base of scoop
      const blobMat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.48,
        metalness: 0.04,
      });
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        const blob = new THREE.Mesh(
          new THREE.SphereGeometry(0.14 * scale, 24, 24),
          blobMat
        );
        blob.position.set(
          x + Math.cos(a) * 0.36 * scale,
          y - 0.32 * scale,
          z + Math.sin(a) * 0.36 * scale
        );
        blob.scale.set(1.15, 0.7, 1.15);
        blob.castShadow = true;
        helado.add(blob);
      }

      helado.add(mesh);
      return mesh;
    }

    scoop(0xffb7c5, 0.62, 0, 0, 1.05);       // fresa
    scoop(0xfff1c9, 1.12, 0.12, 0.08, 0.92); // vainilla
    scoop(0x9ae8c8, 1.55, -0.08, -0.05, 0.82); // menta

    // Soft-serve swirl tip
    const swirl = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 32, 32),
      new THREE.MeshStandardMaterial({
        color: 0x9ae8c8,
        roughness: 0.4,
        metalness: 0.05,
      })
    );
    swirl.position.set(-0.02, 1.95, -0.02);
    swirl.scale.set(1, 1.25, 1);
    swirl.castShadow = true;
    helado.add(swirl);

    // Cherry
    const cherry = new THREE.Mesh(
      new THREE.SphereGeometry(0.13, 32, 32),
      new THREE.MeshStandardMaterial({
        color: 0xd62828,
        roughness: 0.28,
        metalness: 0.15,
      })
    );
    cherry.position.set(0.08, 2.18, 0.05);
    cherry.castShadow = true;
    helado.add(cherry);

    // Cherry stem
    const stemCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.08, 2.28, 0.05),
      new THREE.Vector3(0.14, 2.42, 0.02),
      new THREE.Vector3(0.22, 2.48, -0.02),
    ]);
    const stem = new THREE.Mesh(
      new THREE.TubeGeometry(stemCurve, 20, 0.012, 8, false),
      new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.6 })
    );
    stem.castShadow = true;
    helado.add(stem);

    // Tiny sparkles / sugar crystals
    const sparkleGeo = new THREE.SphereGeometry(0.02, 8, 8);
    const sparkleMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.4,
      emissive: 0xffffff,
      emissiveIntensity: 0.35,
    });
    for (let i = 0; i < 18; i++) {
      const s = new THREE.Mesh(sparkleGeo, sparkleMat);
      const a = Math.random() * Math.PI * 2;
      const r = 0.2 + Math.random() * 0.45;
      s.position.set(
        Math.cos(a) * r,
        0.9 + Math.random() * 1.1,
        Math.sin(a) * r
      );
      s.scale.setScalar(0.6 + Math.random());
      helado.add(s);
    }

    // Gentle bob group
    helado.position.y = 0.05;

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;
      helado.rotation.y = Math.sin(t * 0.35) * 0.15 + t * 0.12;
      helado.position.y = 0.05 + Math.sin(t * 1.1) * 0.04;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
